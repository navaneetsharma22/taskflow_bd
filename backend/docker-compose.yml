version: '3.8'

services:
  # ----------------------------------------------------
  # Redis Caching Service
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis-production
    restart: always
    # No host port exposure — only accessible via internal Docker network
    volumes:
      - redis_data:/data
    networks:
      - taskflow-production-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # MongoDB Database Service (Authenticated)
  # ----------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: taskflow-mongodb-production
    restart: always
    # No host port exposure — only accessible via internal Docker network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-taskflow_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=taskflow
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskflow-production-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --eval 'db.runCommand({ping:1})' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Express SaaS Backend Service
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-backend-production
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env.production  # Must be gitignored — contains all secrets
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_USER:-taskflow_admin}:${MONGO_PASSWORD}@mongodb:27017/taskflow?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow-production-network
    volumes:
      - backend_uploads:/usr/src/app/public/uploads

# ----------------------------------------------------
# Shared Volumes & Networks Configurations
# ----------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  taskflow-production-network:
    driver: bridge
